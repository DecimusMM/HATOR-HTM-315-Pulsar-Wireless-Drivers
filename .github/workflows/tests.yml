name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m py_compile pulsar.py pulsar_gui.py pulsar_macros.py
      - name: Unit tests (no device required)
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: |
          bash -n hator-pulsar
          bash -n hator-pulsar-gui
          bash -n hator-pulsar-macros
          bash -n hator-pulsar.install
          bash -n PKGBUILD
